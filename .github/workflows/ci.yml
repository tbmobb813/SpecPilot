name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # Probe multiple candidate package names for webkit/javascriptcore (varies by Ubuntu release)
          WEBKIT_PKG=""
          for p in libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev; do
            if apt-cache show "$p" >/dev/null 2>&1; then
              WEBKIT_PKG="$p"
              break
            fi
          done

          JS_PKG=""
          for p in libjavascriptcoregtk-4.1-dev libjavascriptcoregtk-4.0-dev javascriptcoregtk-4.1-dev javascriptcoregtk-4.0-dev; do
            if apt-cache show "$p" >/dev/null 2>&1; then
              JS_PKG="$p"
              break
            fi
          done

          echo "Detected packages -> webkit: ${WEBKIT_PKG:-'(none)'} javascriptcore: ${JS_PKG:-'(none)'}"
          sudo apt-get install -y \
            pkg-config \
            build-essential \
            libsoup2.4-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            libatk1.0-dev \
            ${WEBKIT_PKG:+$WEBKIT_PKG} \
            ${JS_PKG:+$JS_PKG} \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Debug pkg-config/setup
        run: |
          echo "pkg-config: $(pkg-config --version || echo 'not found')"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "Searching common pkgconfig dirs for glib/gobject pc files"
          ls -la /usr/lib/x86_64-linux-gnu/pkgconfig || true
          ls -la /usr/lib/pkgconfig || true
          ls -la /usr/share/pkgconfig || true
          echo "Searching for javascriptcore pc files"
          ls -la /usr/lib/x86_64-linux-gnu/pkgconfig | grep -i javascriptcore || true
          ls -la /usr/lib/pkgconfig | grep -i javascriptcore || true
          echo "Try pkg-config queries (non-fatal)"
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1 pkg-config --cflags --libs glib-2.0 || true
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1 pkg-config --cflags --libs gobject-2.0 || true
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1 pkg-config --cflags --libs javascriptcoregtk-4.0 || true

      - name: Install Node dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Rust
        run: cargo build --manifest-path src-tauri/Cargo.toml --verbose

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose
